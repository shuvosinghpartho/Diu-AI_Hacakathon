apiVersion: apps/v1
kind: Deployment
metadata:
  name: visionpay-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visionpay
  template:
    metadata:
      labels:
        app: visionpay
    spec:
      containers:
      - name: visionpay-backend
        image: gcr.io/your-project/visionpay:latest
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: visionpay-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: visionpay-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
